name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.deps }} dependencies (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - deps: minimum
            python: "3.12"
          - deps: latest
            python: "3.13"
          # v2.5.0.1: Python 3.14 (seen on a user's machine as the default 'py'); ruptures has no 3.14 release
          # and is skipped by its marker in requirements-dev.txt
          - deps: latest
            python: "3.14"
    env:
      # One BLAS thread: floating-point sums happen in a fixed order, so results are reproducible.
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONWARNINGS: ignore
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.deps }}" = "minimum" ]; then
            pip install -r requirements-dev.txt -c ci/constraints-min.txt
          else
            pip install -r requirements-dev.txt
          fi
          pip list
      - name: Test suites
        run: |
          status=0
          for t in tests/test_*.py; do
            echo "::group::$t"
            python "$t" || status=1
            echo "::endgroup::"
          done
          exit $status
      - name: Worked examples run end to end
        working-directory: examples
        run: |
          for f in 0*.py; do echo "== $f"; python "$f" > /dev/null || exit 1; done
      - name: Packaged skill matches the source folder (same files, same contents)
        run: |
          mkdir -p "$RUNNER_TEMP/pkg"
          unzip -q dist/econometrics.skill -d "$RUNNER_TEMP/pkg"
          # statistics/, modes/, agents/, evals/ and hooks/ are Claude Code plugin parts; the app package carries one skill
          diff -r -x __pycache__ -x statistics -x modes -x agents -x evals -x hooks "$RUNNER_TEMP/pkg/econometrics" econometrics \
            || { echo "dist/econometrics.skill is stale: rebuild it with 'zip -qrD dist/econometrics.skill econometrics -x \"*__pycache__*\" \"econometrics/statistics/*\" \"econometrics/modes/*\" \"econometrics/agents/*\" \"econometrics/evals/*\" \"econometrics/hooks/*\"'"; exit 1; }
          if unzip -l dist/econometrics.skill | grep -qE "econometrics/(statistics|modes|agents|evals|hooks)/"; then echo "dist must not contain statistics/, modes/, agents/, evals/ or hooks/"; exit 1; fi
      - name: Plugin version matches the latest CHANGELOG version
        run: |
          python - <<'PY'
          import json, re, sys
          v = json.load(open(".claude-plugin/marketplace.json"))["plugins"][0]["version"]
          c = re.search(r"^## v(\S+)", open("CHANGELOG.md", encoding="utf-8").read(), re.M).group(1)
          print(f"plugin {v}, CHANGELOG {c}")
          sys.exit(0 if v == c else "bump the plugin version in .claude-plugin/marketplace.json to match CHANGELOG.md")
          PY
      - name: Run manifests record the released version (reporting.SKILL_VERSION matches CHANGELOG)
        run: |
          python - <<'PY'
          import re, sys
          s = re.search(r'^SKILL_VERSION = "([^"]+)"', open("econometrics/scripts/reporting.py").read(), re.M).group(1)
          c = re.search(r"^## v(\S+)", open("CHANGELOG.md", encoding="utf-8").read(), re.M).group(1)
          print(f"reporting.SKILL_VERSION {s}, CHANGELOG {c}")
          sys.exit(0 if s == c else "set SKILL_VERSION in econometrics/scripts/reporting.py to the CHANGELOG version")
          PY
      # VALIDATION.md's measured differences: every external comparison still within its test's tolerance on the
      # newest dependency versions (v2.6.7). The table records the values of the day it was measured.
      - name: External replications within tolerance (tools/validation_diffs.py --check)
        if: matrix.deps == 'latest' && matrix.python == '3.13'
        run: python tools/validation_diffs.py --check
      # The skill promises Python 3.10+: syntax that only 3.12 accepts (PEP 701 nested f-string quotes) must not
      # slip in. Last step of the job, because setup-python changes the default interpreter.
      - uses: actions/setup-python@v6
        if: matrix.deps == 'minimum'
        with:
          python-version: "3.10"
      - name: Scripts compile on Python 3.10 (the oldest supported)
        if: matrix.deps == 'minimum'
        run: python -m compileall -q econometrics/scripts examples tests

  windows:
    # The user's machines run Windows, often with a space in the user folder ("C:\Users\First Last").
    # Plugins that pass unquoted paths to bash or assume UTF-8 consoles break there; this job runs the
    # whole suite and the worked examples from a checkout path with a space in it.
    name: Windows, path with a space (Python 3.13)
    runs-on: windows-latest
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONWARNINGS: ignore
    defaults:
      run:
        shell: bash
        working-directory: "econometric skills"
    steps:
      - uses: actions/checkout@v5
        with:
          path: "econometric skills"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: "econometric skills/requirements*.txt"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Test suites
        run: |
          status=0
          for t in tests/test_*.py; do
            echo "::group::$t"
            python "$t" || status=1
            echo "::endgroup::"
          done
          exit $status
      - name: Worked examples run end to end
        working-directory: "econometric skills/examples"
        run: |
          for f in 0*.py; do echo "== $f"; python "$f" > /dev/null || exit 1; done
